<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>XGX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#171717;--surf:#212121;--surf2:#2f2f2f;--text:#ececec;--mut:#9b9b9b;--bd:#303030;--acc:#2dd4a7;--accfg:#06241c;--danger:#ef4444}
body.light{--bg:#ffffff;--surf:#f7f7f8;--surf2:#ececee;--text:#1a1a1a;--mut:#6e6e73;--bd:#e4e4e7;--acc:#0f9d76;--accfg:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.s{width:14px;height:14px}
.ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ib:hover,.ib:active{background:var(--surf2)}
header{display:grid;grid-template-columns:128px 1fr 128px;align-items:center;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));position:relative}
header .end{display:flex;justify-content:flex-end}
header .mid{display:flex;justify-content:center;position:relative}
.pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;font-weight:600;font-size:15px}
.pill:hover{background:var(--surf2)}
.menu{position:absolute;background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:6px;display:none;z-index:30;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.menu.show{display:block}
#model-menu{top:46px;width:250px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;text-align:start}
.mi:hover{background:var(--surf2)}
.mi .t{flex:1}.mi b{display:block;font-size:14px;font-weight:600}.mi small{color:var(--mut);font-size:12px}
.mi .ck{color:var(--acc)}
.tag{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:4px}
#chat{flex:1;overflow-y:auto;padding:8px 16px 16px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-height:100%}
.welcome{margin:auto;text-align:center;padding:30px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--acc);color:var(--accfg);display:flex;align-items:center;justify-content:center}
.logo .i{width:28px;height:28px;fill:currentColor;stroke:none}
.welcome h1{font-size:22px;font-weight:700;margin-top:8px}
.welcome p{color:var(--mut);font-size:14px}
.row{display:flex;gap:12px;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.row.user{justify-content:flex-start}
.bub{background:var(--surf2);padding:10px 16px;border-radius:20px;max-width:85%;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;display:flex;flex-direction:column;gap:8px}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--accfg);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.av .i{width:15px;height:15px;fill:currentColor;stroke:none}
.body{flex:1;min-width:0;line-height:1.9;white-space:pre-wrap;word-wrap:break-word}
.cw{padding:6px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.composer{max-width:720px;margin:0 auto;background:var(--surf);border:1px solid var(--bd);border-radius:26px;padding:8px 10px;position:relative}
.composer:focus-within{border-color:var(--mut)}
#pend{display:none;padding:4px 4px 8px}
#pend.show{display:block}
.pc{display:inline-flex;align-items:center;gap:8px;background:var(--surf2);border-radius:12px;padding:6px 8px;font-size:13px;max-width:100%}
.pc button{color:var(--mut);display:flex}
textarea{width:100%;background:none;border:none;outline:none;color:var(--text);font:inherit;resize:none;max-height:140px;padding:6px 8px;line-height:1.6;display:block}
textarea::placeholder{color:var(--mut)}
.bar{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.bar .g{display:flex;gap:4px;align-items:center}
.cb{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text)}
.cb:hover{background:var(--surf2)}
.send{background:var(--acc);color:var(--accfg)}
.send:disabled{background:var(--surf2);color:var(--mut);cursor:default;}
#plus-menu{bottom:100%;margin-bottom:8px;right:0;width:200px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.ov.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:290px;max-width:85%;background:var(--surf);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .25s;z-index:50;display:flex;flex-direction:column;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.drawer.open{transform:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 6px 12px}
.avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;display:block}
.avatar svg{width:100%;height:100%;display:block}
.nb{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);margin-bottom:12px}
.nb:hover{background:var(--surf2)}
.lbl{font-size:12px;color:var(--mut);padding:0 8px 6px}
#hist{flex:1;overflow-y:auto}
.h{display:flex;align-items:center;gap:6px;padding:10px;border-radius:10px;cursor:pointer;font-size:14px}
.h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h:hover,.h.on{background:var(--surf2)}
.h button{color:var(--mut);display:none}.h:hover button{display:flex}
.vipcard{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:14px;background:var(--surf2);margin-top:10px;text-align:start}
.vipcard .i{color:#f5b942;fill:#f5b942}
.vipcard b{display:block;font-size:14px}.vipcard small{color:var(--mut);font-size:12px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-radius:24px 24px 0 0;padding:20px 16px;padding-bottom:max(20px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s;z-index:60;max-width:520px;margin:0 auto}
.sheet.show{transform:none}
.sheet h2{font-size:19px;display:flex;align-items:center;gap:8px}
.sheet h2 .i{color:#f5b942;fill:#f5b942}
.sheet ul{list-style:none;margin:12px 0 16px;display:flex;flex-direction:column;gap:8px;color:var(--mut);font-size:14px}
.sheet li{display:flex;gap:8px;align-items:center}.sheet li .i{color:var(--acc);width:16px;height:16px}
.buy{width:100%;padding:14px;border-radius:14px;background:var(--acc);color:var(--accfg);font-weight:700;margin-top:4px}
html[dir=ltr] .drawer{right:auto;left:0;border-left:none;border-right:1px solid var(--bd);transform:translateX(-100%)}
html[dir=ltr] .drawer.open{transform:none}
html[dir=ltr] #plus-menu{right:auto;left:0}
.quota{max-width:720px;margin:0 auto 6px;text-align:center;font-size:12px;color:var(--mut)}
.quota:empty{display:none}
#lang-menu{top:50px;inset-inline-end:8px;width:170px;max-height:60vh;overflow-y:auto}
.flag{font-size:20px;line-height:1;display:inline-block;width:26px;text-align:center}
#lang-btn .flag{font-size:22px;width:auto}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>

<header>

        </div>

  </div>
</div>

};
const t = k => (I18N[lang] || I18N.en)[k] ?? I18N.en[k] ?? k;

function checkVip() { const u = (tg?.initDataUnsafe?.user?.username || "").toLowerCase(); isVip = VIP_USERS.some(x => x.toLowerCase() === u); }

function save() { try { localStorage.setItem('xgx', JSON.stringify({s: sessions, t: document.body.classList.contains('light'), m: model.id, l: lang})); } catch(e){} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('xgx') || '{}');
    sessions = d.s || [];
    if (d.t) document.body.classList.add('light');
    model = MODELS.find(m => m.id === d.m) || MODELS[0];
    lang = LANGS.some(x => x.id === d.l) ? d.l : 'en';
    checkVip();
    if (model.vip && !isVip) model = MODELS[0];
  } catch(e){}
}

function render() {
  const w = $('wrap'); w.innerHTML = '';
  if (!cur.messages.length) {
    w.innerHTML = `<div class="welcome"><div class="logo">${ic('spark')}</div><h1>${t('greet')}</h1><p>${t('greetSub')}</p></div>`;
  } else {
    cur.messages.forEach(m => {
      const r = document.createElement('div'); r.className = 'row ' + m.role;
      if (m.role === 'user') {
        r.innerHTML = `<div class="bub">${m.text}</div>`;
      } else {
        r.innerHTML = `<div class="av">${ic('spark')}</div><div class="body">${m.text}</div>`;
      }
      w.appendChild(r);
    });
  }
  $('chat').scrollTop = $('chat').scrollHeight;
  renderHist();
  setVip(isVip);
  updQuota();
}

function renderHist() {
  const h = $('hist'); h.innerHTML = '';
  sessions.filter(s => s.messages.length).forEach(s => {
    const d = document.createElement('div'); d.className = 'h' + (s === cur ? ' on' : '');
    d.innerHTML = `<span>${s.title}</span><button onclick="delHist(event, ${s.id})">${ic('x','s')}</button>`;
    d.onclick = () => { cur = s; render(); closeAll(); };
    h.appendChild(d);
  });
}

function delHist(e, id) {
  e.stopPropagation();
  sessions = sessions.filter(x => x.id !== id);
  if (cur.id === id) newChat();
  else renderHist();
  save();
}

function newChat() {
  cur = {id: Date.now(), title: 'New chat', messages: []};
  sessions.unshift(cur);
  render();
}

function toggleTheme() { document.body.classList.toggle('light'); themeIcon(); save(); }
function themeIcon() { $('theme-btn').innerHTML = ic(document.body.classList.contains('light') ? 'sun' : 'moon'); }

function closeMenus() { document.querySelectorAll('.menu').forEach(m => m.classList.remove('show')); }
function tgl(e, id, fn) {
  e.stopPropagation();
  const m = $(id), was = m.classList.contains('show');
  closeMenus();
  if (!was) { fn?.(); m.classList.add('show'); }
}
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });

function buildModels() {
  const m = $('model-menu'); m.innerHTML = '';
  MODELS.forEach(x => {
    const lock = x.vip && !isVip;
    const b = document.createElement('button'); b.className = 'mi';
    b.innerHTML = `<span class="t"><b>${x.name}</b><small>${t(x.desc)}</small></span>` + (x.id === model.id ? `<span class="ck">${ic('check')}</span>` : lock ? `<span class="tag">${ic('lock','s')}VIP</span>` : '');
    b.onclick = () => {
      closeMenus();
      if (lock) { openVip(); return; }
      model = x; $('mname').textContent = x.name; save();
    };
    m.appendChild(b);
  });
}

function buildLangs() {
  const m = $('lang-menu'); m.innerHTML = '';
  LANGS.forEach(x => {
    const b = document.createElement('button'); b.className = 'mi';
    b.innerHTML = `<span class="flag">${x.flag}</span><span class="t"><b>${x.name}</b></span>` + (x.id === lang ? `<span class="ck">${ic('check')}</span>` : '');
    b.onclick = () => { lang = x.id; save(); closeMenus(); applyLang(); };
    m.appendChild(b);
  });
}

function openDrawer() { renderHist(); $('drawer').classList.add('open'); $('ov').classList.add('show'); }
function closeAll() { $('drawer').classList.remove('open'); $('sheet').classList.remove('show'); $('ov').classList.remove('show'); closeMenus(); }

function setVip(v) {
  isVip = !!v;
  $('vtitle').textContent = t(isVip ? 'vipOn' : 'vipUp');
  $('vsub').textContent = t(isVip ? 'vipSubOn' : 'vipSubUp');
}
function openVip() { closeAll(); $('ov').classList.add('show'); $('sheet').classList.add('show'); }
function buyVip() { closeAll(); tg?.showAlert(t('buyAlert')); }

function updQuota() {
  if (isVip) {
    $('quota').textContent = `👑 VIP 👑 (${t('unl')})`;
    return;
  }

  const today = new Date().toISOString().split('T')[0];
  let limitData = JSON.parse(localStorage.getItem('xgx_limit') || '{}');

  // First visit: record today as the first day
  if (!limitData.first_use) limitData.first_use = today;

  // New day: reset the counter
  if (limitData.date !== today) {
    limitData.date = today;
    limitData.count = 0;
  }

  localStorage.setItem('xgx_limit', JSON.stringify(limitData));

  // First day: 10 messages, later days: 5 messages
  const isFirstDay = limitData.first_use === today;
  const maxAllowed = isFirstDay ? 10 : 5;
  const remaining = Math.max(0, maxAllowed - (limitData.count || 0));

  $('quota').textContent = t('left').replace('{n}', remaining);
}

function toast(msg) { const e = $('toast'); e.textContent = msg; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2400); }

function applyLang() {
  const L = LANGS.find(x => x.id === lang) || LANGS[0];
  document.documentElement.lang = L.id; document.documentElement.dir = L.dir;
  $('lflag').textContent = L.flag;
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  $('inp').placeholder = t('ph');
  setVip(isVip);
  render();
}

function pick(id) { closeMenus(); $(id).click(); }
['file-in', 'img-in'].forEach(id => $(id).addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  pend = { name: f.name };
  renderPend(); $('inp').focus();
}));

function renderPend() {
  const p = $('pend');
  p.classList.toggle('show', !!pend);
  p.innerHTML = '';
  if (pend) {
    const c = document.createElement('div'); c.className = 'pc';
    c.innerHTML = `${ic('file')}<span>${pend.name}</span><button onclick="pend=null;renderPend()">${ic('x','s')}</button>`;
    p.appendChild(c);
  }
}

async function handleSend() {
  const text = $('inp').value.trim();
  if ((!text && !pend) || busy) return;
  if (model.vip && !isVip) { openVip(); return; }

  // Daily limit: 10 messages on the first day, 5 on later days, unlimited for VIP
  if (!isVip) {
    const today = new Date().toISOString().split('T')[0];
    let limitData = JSON.parse(localStorage.getItem('xgx_limit') || '{}');

    if (!limitData.first_use) limitData.first_use = today;
    if (limitData.date !== today) {
      limitData.date = today;
      limitData.count = 0;
    }

    const isFirstDay = limitData.first_use === today;
    const maxAllowed = isFirstDay ? 10 : 5;

    if (limitData.count >= maxAllowed) {
      toast(t('limitHit'));
      openVip();
      return;
    }

    limitData.count++;
    localStorage.setItem('xgx_limit', JSON.stringify(limitData));
    updQuota();
  }

  if (!cur) newChat();
  const fileToSend = pend ? pend.name : null;
  cur.messages.push({role: 'user', text: esc(text) + (pend ? ` [File: ${esc(pend.name)}]` : '')});
  if (cur.messages.length === 1) cur.title = esc(text.slice(0, 30) || pend.name);

  const pending = {role: 'assistant', text: '…'};
  cur.messages.push(pending);
  $('inp').value = '';
  pend = null; renderPend();
  busy = true; $('send').disabled = true;
  render(); save();

  try {
    const res = await fetch("https://ktowtpyyuhzronbfzoyw.supabase.co/functions/v1/super-handler", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer sb_publishable_MgZiGFoBnEVKyq39Xu8ZQQ_WMniC6oF',
        'apikey': 'sb_publishable_MgZiGFoBnEVKyq39Xu8ZQQ_WMniC6oF'
      },
      body: JSON.stringify({ message: text, model: model.id, lang: lang, file: fileToSend })
    });
    const data = await res.json().catch(() => ({}));
    const reply = data.reply ?? data.message ?? data.text ?? data.response ?? '';
    pending.text = esc(reply || ('HTTP ' + res.status));
  } catch (err) {
    pending.text = '⚠️ ' + esc(err.message);
  } finally {
    busy = false;
    $('send').disabled = !$('inp').value.trim();
    render(); save();
  }
}

$('inp').addEventListener('input', () => { $('send').disabled = !$('inp').value.trim() && !pend; });
$('inp').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

load(); themeIcon(); applyLang();
newChat();
</script>
