<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>XGX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#171717;--surf:#212121;--surf2:#2f2f2f;--text:#ececec;--mut:#9b9b9b;--bd:#303030;--acc:#2dd4a7;--accfg:#06241c;--danger:#ef4444;--inp:#212121;--inp-tx:#ececec;--edge:#ffffff;--send-bg:#1e88ff;--send-fg:#ffffff}
body.light{--bg:#ffffff;--surf:#f7f7f8;--surf2:#ececee;--text:#1a1a1a;--mut:#6e6e73;--bd:#e4e4e7;--acc:#0f9d76;--accfg:#fff;--inp:#ffffff;--inp-tx:#1a1a1a;--edge:#1a1a1a;--send-bg:#1e88ff;--send-fg:#ffffff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.s{width:14px;height:14px}
.ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ib:hover,.ib:active{background:var(--surf2)}
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));position:relative;border-bottom:1px solid var(--bd)}
header .start{display:flex;justify-content:flex-start}
header .mid{display:flex;justify-content:center}
header .end{display:flex;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;font-weight:600;font-size:15px}
#chat{flex:1;overflow-y:auto;padding:8px 16px 16px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-height:100%}
.welcome{margin:auto;text-align:center;padding:30px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--acc);color:var(--accfg);display:flex;align-items:center;justify-content:center}
.logo .i{width:28px;height:28px;fill:currentColor;stroke:none}
.welcome h1{font-size:22px;font-weight:700;margin-top:8px}
.welcome p{color:var(--mut);font-size:14px}
.row{display:flex;gap:12px;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.row.user{justify-content:flex-end}
.bub{background:var(--surf2);padding:10px 16px;border-radius:20px;max-width:85%;line-height:1.7;white-space:pre-wrap;word-wrap:break-word}
.av{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--accfg);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.av .i{width:15px;height:15px;fill:currentColor;stroke:none}
.body{flex:1;min-width:0;line-height:1.9;white-space:pre-wrap;word-wrap:break-word}
.cw{padding:6px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.composer{max-width:720px;margin:0 auto;background:var(--inp);border:1px solid var(--edge);border-radius:26px;padding:8px 10px;position:relative}
.composer:focus-within{box-shadow:0 0 0 3px rgba(127,127,127,.25)}
textarea{width:100%;background:none;border:none;outline:none;color:var(--inp-tx);font:inherit;resize:none;max-height:140px;padding:6px 8px;line-height:1.6;display:block}
textarea::placeholder{color:var(--mut)}
.bar{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.cb{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--inp-tx)}
.cb:hover{background:var(--surf2)}
.send{width:42px;height:42px;background:var(--send-bg);color:var(--send-fg)}
.send .i{width:26px;height:26px;stroke-width:2.2}
.send:disabled{background:var(--send-bg);color:var(--send-fg);opacity:.35;cursor:default}
.quota{max-width:720px;margin:0 auto 6px;text-align:center;font-size:12px;color:var(--mut)}
.quota:empty{display:none}
.dots{display:flex;gap:5px;padding:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;white-space:nowrap}
#toast.show{opacity:1}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.ov.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:85%;background:var(--surf);border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .25s;z-index:50;display:flex;flex-direction:column;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.drawer.open{transform:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 6px 12px}
.avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;display:block}
.avatar svg{width:100%;height:100%;display:block}
.nb{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);margin-bottom:12px}
.nb:hover{background:var(--surf2)}
.lbl{font-size:12px;color:var(--mut);padding:0 8px 6px}
#hist{flex:1;overflow-y:auto}
.h{display:flex;align-items:center;gap:6px;padding:10px;border-radius:10px;cursor:pointer;font-size:14px}
.h span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h:hover,.h.on{background:var(--surf2)}
.h button{color:var(--mut);display:flex;padding:4px}
.vipcard{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:14px;background:var(--surf2);margin-top:10px;text-align:start}
.vipcard .i{color:#f5b942;fill:#f5b942}
.vipcard b{display:block;font-size:14px}.vipcard small{color:var(--mut);font-size:12px}

.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-radius:24px 24px 0 0;padding:20px 16px;padding-bottom:max(20px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s;z-index:60;max-width:520px;margin:0 auto;border-top:1px solid var(--bd)}
.sheet.show{transform:none}
.sx{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.sx:hover{background:var(--surf2)}
.sheet h2{font-size:19px;display:flex;align-items:center;gap:8px;color:var(--acc)}
.sheet ul{list-style:none;margin:12px 0 16px;display:flex;flex-direction:column;gap:8px;color:var(--mut);font-size:14px}
.sheet li{display:flex;gap:8px;align-items:center}.sheet li .i{color:var(--acc);width:16px;height:16px}
.plan{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;border:1.5px solid var(--bd);border-radius:14px;margin-bottom:10px;text-align:start}
.plan small{display:block;color:var(--acc);font-size:12px;margin-top:2px}
.plan .pr{font-weight:700;color:var(--acc);font-size:16px}

<script>
const BACKEND_URL = "https://ktowtpyyuhzronbfzoyw.supabase.co/functions/v1/super-handler";
const SUPABASE_KEY = "sb_publishable_MgZiGFoBnEVKyq39Xu8ZQQ_WMniC6oF";
const VIP_USERS = ["LLPFQ"];   // VIP username
const KEEP_DAYS_FREE = 3;      // chat history kept for normal users (days after last message)
const KEEP_DAYS_VIP = 30;      // chat history kept for VIP users (days after last message)
const FIRST_DAY_LIMIT = 10;    // messages allowed on the first day
const LATER_DAY_LIMIT = 3;     // messages allowed on later days

const tg = window.Telegram?.WebApp;
tg?.expand();
tg?.ready();

const $ = id => document.getElementById(id);
const ic = (n, c = '') => `<svg class="i ${c}"><use href="#${n}"/></svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const unesc = s => String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');

const myUser = (tg?.initDataUnsafe?.user?.username || "").toLowerCase();
const isVip = VIP_USERS.some(u => u.toLowerCase() === myUser);
let busy = false;
let sessions = [];
let cur = null;
let isProMode = false;
let isRecording = false;
let recognition = null;

// ---------- theme ----------
function toggleTheme() {
  document.body.classList.toggle('light');
  try { localStorage.setItem('xgx_theme', document.body.classList.contains('light') ? 'light' : 'dark'); } catch (e) {}
  themeIcon();
}
function themeIcon() {
  const b = $('theme-btn');
  if (b) b.innerHTML = ic(document.body.classList.contains('light') ? 'sun' : 'moon');
}

// ---------- pro mode ----------
function toggleProMode() {
  isProMode = !isProMode;
  $('pro-btn').classList.toggle('on', isProMode);
  toast(isProMode ? "Code mode on: serious, technical answers 💻" : "Code mode off");
}

// ---------- chat history ----------
function saveAll() {
  try { localStorage.setItem('xgx_chats', JSON.stringify(sessions)); } catch (e) {}
}
function loadAll() {
  try { sessions = JSON.parse(localStorage.getItem('xgx_chats') || '[]'); } catch (e) { sessions = []; }
  pruneOld();
}
function pruneOld() {
  const keepMs = (isVip ? KEEP_DAYS_VIP : KEEP_DAYS_FREE) * 86400000;
  const now = Date.now();
  sessions = sessions.filter(s => now - s.ts <= keepMs);
  saveAll();
}
function newChat() {
  cur = {id: Date.now(), title: 'New chat', ts: Date.now(), messages: []};
  render();
  renderHist();
}
function openChat(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  cur = s;
  render();
  renderHist();
  closeAll();
}
function delChat(e, id) {
  e.stopPropagation();
  sessions = sessions.filter(x => x.id !== id);
  saveAll();
  if (cur && cur.id === id) newChat();
  else renderHist();
}
function renderHist() {
  const h = $('hist');
  h.innerHTML = '';
  [...sessions].sort((a, b) => b.ts - a.ts).forEach(s => {
    const d = document.createElement('div');
    d.className = 'h' + (cur && s.id === cur.id ? ' on' : '');
    d.innerHTML = `<span>${s.title}</span><button onclick="delChat(event, ${s.id})">${ic('x', 's')}</button>`;
    d.onclick = () => openChat(s.id);
    h.appendChild(d);
  });
}

// ---------- chat view ----------
function render() {
  const w = $('wrap');
  w.innerHTML = '';
  if (!cur || !cur.messages.length) {
    w.innerHTML = `<div class="welcome"><div class="logo pic"></div><h1>Hey bro, what do you want?</h1><p>Type your message and let's go.</p></div>`;
  } else {
    cur.messages.forEach((m, i) => {
      const r = document.createElement('div');
      r.className = 'row ' + m.role;
      if (m.role === 'user') {
        r.innerHTML = `<div class="bub">${m.text}</div>`;
      } else {
        r.innerHTML = `<div class="av">${ic('spark')}</div><div class="col"><div class="body">${fmt(m.text)}</div><div class="acts"><button class="actbtn" onclick="copyMsg(this, ${i})">📋 Copy</button><button class="actbtn" data-react="like" onclick="reactMsg(this, 'like')">👍</button><button class="actbtn" data-react="dislike" onclick="reactMsg(this, 'dislike')">👎</button></div></div>`;
      }
      w.appendChild(r);
    });
  }
  $('chat').scrollTop = $('chat').scrollHeight;
  updQuota();
}

// ---------- formatting and copy ----------
function fmt(s) {
  return s.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const label = lang.trim() || 'code';
    return `<div class="cblk"><div class="cbar"><span>${label}</span><button class="cbtn" onclick="copyCode(this)">Copy</button></div><pre><code>${code.replace(/\n+$/, '')}</code></pre></div>`;
  });
}
function copyText(txt, done) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else {
    fallbackCopy(txt, done);
  }
}
function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed! ❌'); }
  ta.remove();
}
function flash(btn, label, back) {
  btn.textContent = label;
  setTimeout(() => { btn.textContent = back; }, 1500);
}
function copyCode(btn) {
  const txt = btn.closest('.cblk').querySelector('code').textContent;
  copyText(txt, () => flash(btn, 'Copied', 'Copy'));
}
function copyMsg(btn, i) {
  const m = cur.messages[i];
  if (!m) return;
  copyText(unesc(m.text), () => flash(btn, '✅ Copied', '📋 Copy'));
}
function reactMsg(btn, kind) {
  const row = btn.closest('.acts');
  row.querySelectorAll('[data-react]').forEach(b => b.classList.remove('on', 'off'));
  btn.classList.add(kind === 'like' ? 'on' : 'off');
}

// ---------- toast ----------
function toast(msg) {
  const e = $('toast');
  e.textContent = msg;
  e.classList.add('show');
  setTimeout(() => e.classList.remove('show'), 2400);
}

// ---------- daily limit ----------
function getLimitData() {
  const today = new Date().toISOString().split('T')[0];
  const data = JSON.parse(localStorage.getItem('xgx_limit') || '{}');
  if (!data.first_use) data.first_use = today;
  if (data.date !== today) { data.date = today; data.count = 0; }
  return { data, today };
}
function updQuota() {
  const q = $('quota');
  if (isVip) { q.textContent = "👑 VIP 👑 (Unlimited)"; return; }
  const { data, today } = getLimitData();
  const maxAllowed = data.first_use === today ? FIRST_DAY_LIMIT : LATER_DAY_LIMIT;
  const remaining = Math.max(0, maxAllowed - data.count);
  q.textContent = `Messages left today: ${remaining}`;
}

// ---------- drawer and VIP panel ----------
function updVipCard() {
  $('vtitle').textContent = isVip ? 'VIP active' : 'Upgrade to VIP';
  $('vsub').textContent = isVip ? 'Unlimited messages · history kept 30 days' : 'Unlimited messages, DeepSeek and GPT';
}
function openDrawer() {
  pruneOld();
  renderHist();
  $('drawer').classList.add('open');
  $('ov').classList.add('show');
}
function closeDrawer() { $('drawer').classList.remove('open'); }
function openVip() {
  closeDrawer();
  $('ov').classList.add('show');
  $('sheet').classList.add('show');
}
function closeVip() {
  $('sheet').classList.remove('show');
  $('ov').classList.remove('show');
}
function closeAll() {
  closeDrawer();
  closeVip();
}
function copyTON() {
  const address = "UQAPHizKWiZrTKECmtJq7M4nV-mFG4gGgBVmr1b408gxV3Cx";
  navigator.clipboard.writeText(address).then(() => {
    toast("Address copied! ✅");
  }).catch(() => {
    toast("Copy failed! ❌");
  });
}
function requestPayment(plan, price) {
  const username = tg?.initDataUnsafe?.user?.username || "NoUsername";
  tg.sendData(JSON.stringify({
    action: "payment_request",
    plan: plan,
    price: price,
    username: username
  }));
  setTimeout(() => tg.close(), 500);
}

// ---------- voice input ----------
function toggleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("Voice input is not supported in this browser ❌");
  if (isRecording && recognition) { recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'fa-IR';
  recognition.continuous = false;
  recognition.onstart = () => {
    isRecording = true;
    $('mic-btn').classList.add('rec');
    toast("Listening... speak now 🎙️");
  };
  recognition.onresult = e => {
    $('inp').value += e.results[0][0].transcript + " ";
    $('send').disabled = !$('inp').value.trim() || busy;
  };
  recognition.onerror = () => toast("Voice input error ❌");
  recognition.onend = () => {
    isRecording = false;
    $('mic-btn').classList.remove('rec');
  };
  recognition.start();
}

// ---------- sending ----------
async function handleSend() {
  const text = $('inp').value.trim();
  if (!text || busy) return;

  if (!isVip) {
    const { data, today } = getLimitData();
    const maxAllowed = data.first_use === today ? FIRST_DAY_LIMIT : LATER_DAY_LIMIT;
    if (data.count >= maxAllowed) {
      toast("Your daily limit is used up. Come back tomorrow or get VIP.");
      openVip();
      return;
    }
    data.count++;
    localStorage.setItem('xgx_limit', JSON.stringify(data));
    updQuota();
  }

  if (!cur) newChat();
  const chat = cur;
  if (!sessions.includes(chat)) sessions.unshift(chat);
  if (!chat.messages.length) chat.title = esc(text.slice(0, 30));
  const history = chat.messages.slice(-15).map(m => ({
    role: m.role === 'bot' ? 'assistant' : 'user',
    content: unesc(m.text)
  }));
  chat.messages.push({role: 'user', text: esc(text)});
  chat.ts = Date.now();

  $('inp').value = '';
  busy = true;
  $('send').disabled = true;
  render();
  renderHist();
  saveAll();

  const typing = document.createElement('div');
  typing.className = 'row bot';
  typing.id = 'typing';
  typing.innerHTML = `<div class="av">${ic('spark')}</div><div class="dots"><i></i><i></i><i></i></div>`;
  $('wrap').appendChild(typing);
  $('chat').scrollTop = $('chat').scrollHeight;

  try {
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({
        message: text,
        history: history,
        initData: tg?.initData || "",
        chat_id: String(chat.id),
        pro_mode: isProMode
      })
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 429) {
      chat.messages.push({role: 'bot', text: esc(data.reply || 'Daily limit reached.')});
      openVip();
    } else if (!res.ok) {
      throw new Error(data.reply || `HTTP ${res.status}`);
    } else {
      chat.messages.push({role: 'bot', text: esc(data.reply ?? '')});
    }
  } catch (err) {
    chat.messages.push({role: 'bot', text: "⚠️ Server connection error. Please try again."});
  } finally {
    $('typing')?.remove();
    chat.ts = Date.now();
    busy = false;
    $('send').disabled = !$('inp').value.trim();
    render();
    renderHist();
    saveAll();
  }
}

// ---------- start ----------
const inpEl = $('inp');
inpEl.addEventListener('input', () => { $('send').disabled = !inpEl.value.trim() || busy; });
inpEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

loadAll();
newChat();
if (localStorage.getItem('xgx_theme') === 'light') document.body.classList.add('light');
themeIcon();
updVipCard();
</script>
